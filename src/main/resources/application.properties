# Email notifications (sale-created alert to admin) - sent via Gmail SMTP.
# Username/password are read from environment variables so the Gmail App
# Password never ends up committed to Git. The recipient address isn't
# sensitive, so it has a plain default here (still overridable via env var).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.notifications.admin-email=${ADMIN_NOTIFICATION_EMAIL:kuldeepfurniture.in@gmail.com}
app.notifications.enabled=${SALE_EMAIL_NOTIFICATIONS_ENABLED:true}